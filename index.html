<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Volt</title>
    <style>
        :root {
            --bg: #f6f8fc;
            --card: #fff;
            --tx: #14213d;
            --mu: #5b6785;
            --ac: #f5b700;
            --ac2: #2563eb;
            --ok: #16a34a;
            --bad: #dc2626;
            --bd: #e2e8f3;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0b1020;
                --card: #151c33;
                --tx: #e8ecf8;
                --mu: #9aa6c7;
                --bd: #263052
            }
        }

        :root[data-theme="dark"] {
            --bg: #0b1020;
            --card: #151c33;
            --tx: #e8ecf8;
            --mu: #9aa6c7;
            --bd: #263052
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
            line-height: 1.6
        }

        .w {
            max-width: 1000px;
            margin: auto;
            padding: 0 20px
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0
        }

        .logo {
            font-weight: 800;
            font-size: 20px
        }

        .logo b {
            color: var(--ac)
        }

        button {
            font: inherit;
            cursor: pointer
        }

        .lang {
            border: 1px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 20px;
            padding: 6px 14px
        }

        .hero {
            text-align: center;
            padding: 48px 0 32px
        }

        .hero h1 {
            font-size: clamp(30px, 6vw, 52px);
            line-height: 1.15;
            margin: 0 0 14px
        }

        .hero h1 span {
            color: var(--ac2)
        }

        .hero p {
            color: var(--mu);
            max-width: 560px;
            margin: 0 auto 24px;
            font-size: 18px
        }

        .cta {
            background: var(--ac);
            color: #14213d;
            border: 0;
            border-radius: 12px;
            padding: 13px 26px;
            font-weight: 700;
            font-size: 16px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
            margin: 24px 0
        }

        .f {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 16px;
            padding: 18px
        }

        .f i {
            font-style: normal;
            font-size: 26px
        }

        .f h3 {
            margin: 6px 0 4px;
            font-size: 17px
        }

        .f p {
            margin: 0;
            color: var(--mu);
            font-size: 14px
        }

        h2 {
            text-align: center;
            font-size: 28px;
            margin: 44px 0 6px
        }

        .sub {
            text-align: center;
            color: var(--mu);
            margin: 0 0 22px
        }

        .demo {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 18px;
            align-items: start
        }

        @media(max-width:760px) {
            .demo {
                grid-template-columns: 1fr
            }
        }

        .panel {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 20px
        }

        .bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 14px
        }

        .chip {
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 14px;
            font-weight: 600
        }

        .q {
            font-size: 18px;
            font-weight: 700;
            margin: 6px 0 12px
        }

        .opt {
            display: block;
            width: 100%;
            text-align: start;
            background: var(--bg);
            color: var(--tx);
            border: 2px solid var(--bd);
            border-radius: 12px;
            padding: 11px 14px;
            margin: 8px 0
        }

        .opt:hover:not(:disabled) {
            border-color: var(--ac2)
        }

        .opt.ok {
            border-color: var(--ok);
            background: rgba(22, 163, 74, .15)
        }

        .opt.bad {
            border-color: var(--bad);
            background: rgba(220, 38, 38, .12)
        }

        .hint {
            margin-top: 10px;
            background: rgba(245, 183, 0, .15);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 14px
        }

        .row {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap
        }

        .sec {
            background: var(--bg);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 8px 14px
        }

        .sec:disabled {
            opacity: .5;
            cursor: default
        }

        .pri {
            background: var(--ac2);
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 9px 18px;
            font-weight: 600
        }

        .res {
            text-align: center
        }

        .res .big {
            font-size: 42px;
            font-weight: 800;
            color: var(--ac2)
        }

        .t {
            margin: 12px 0
        }

        .t div.l {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            font-weight: 600
        }

        .pb {
            height: 9px;
            background: var(--bg);
            border-radius: 6px;
            overflow: hidden;
            margin-top: 4px
        }

        .pb i {
            display: block;
            height: 100%;
            background: var(--ac);
            border-radius: 6px;
            transition: width .4s
        }

        .steps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            counter-reset: s
        }

        .st {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px;
            font-size: 14px
        }

        .st::before {
            counter-increment: s;
            content: counter(s);
            display: inline-block;
            width: 24px;
            height: 24px;
            line-height: 24px;
            text-align: center;
            background: var(--ac);
            color: #14213d;
            border-radius: 50%;
            font-weight: 700;
            margin-inline-end: 6px
        }

        a.cta {
            display: inline-block;
            text-decoration: none
        }

        .cta2 {
            background: transparent;
            color: var(--tx);
            border: 2px solid var(--bd);
            border-radius: 12px;
            padding: 11px 24px;
            font-weight: 700;
            font-size: 16px;
            margin: 6px
        }

        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 14px;
            flex-wrap: wrap
        }

        .tabs .on {
            background: var(--ac2);
            color: #fff;
            border-color: var(--ac2)
        }

        .it {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--bd)
        }

        .it:last-child {
            border: 0
        }

        .it .ic {
            font-size: 28px
        }

        .it .nm {
            flex: 1;
            font-weight: 600
        }

        input.em {
            background: var(--bg);
            color: var(--tx);
            border: 2px solid var(--bd);
            border-radius: 10px;
            padding: 11px 14px;
            font: inherit;
            min-width: 230px;
            margin: 6px
        }

        .lv {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--bd)
        }

        .cv {
            touch-action: none;
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 12px;
            color: var(--tx);
            user-select: none
        }

        .tray {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin: 8px 0
        }

        .tray button {
            touch-action: none;
            cursor: grab
        }

        footer {
            text-align: center;
            color: var(--mu);
            font-size: 13px;
            padding: 40px 0
        }
    </style>
</head>

            <p class="sub" data-k="sgs"></p>

                const lit = ok && (p.k == 'led' || p.k == 'bulb');
                s += (lit ? `<circle cx='${p.x}' cy='${p.y}' r='30' fill='${p.k == 'led' ? '#ef4444' : '#f5b700'}' opacity='.45'/>` : '') + `<g data-id='${p.id}' style='cursor:grab'><rect x='${p.x - 22}' y='${p.y - 16}' width='44' height='32' rx='8' fill='var(--card)' stroke='currentColor' stroke-width='2'/><text x='${p.x}' y='${p.y + 6}' text-anchor='middle' font-size='16' stroke='none' fill='currentColor' pointer-events='none'>${p.k == 'sw' ? (p.on ? '🟢' : '⚪') : KS[p.k]}</text></g>`;
                ['a', 'b'].forEach(k => { const x = p.x + (k == 'a' ? -26 : 26), id = p.id + '.' + k; s += `<circle data-t='${id}' cx='${x}' cy='${p.y}' r='7' fill='${C.sel == id ? '#f5b700' : 'var(--bg)'}' stroke='currentColor' stroke-width='2'/>` + ((p.k == 'bat' || p.k == 'led') && k == 'a' ? `<text x='${x}' y='${p.y - 11}' font-size='11' text-anchor='middle' stroke='none' fill='currentColor'>+</text>` : '') })
            });
            sv.innerHTML = s;
            if (mode == 'j' && ok) { const J = t().pj[C.proj]; if (J.p.every(k => C.parts.some(p => p.k == k)) && !C.pdone[C.proj]) { C.pdone[C.proj] = 1; S.sp += 10; stats(); $('cm').innerHTML = `<div class='hint'>🎉 ${t().pdn}</div>` } }
        }
        function rs0() { C.parts = []; C.wires = []; C.sel = null; C.last = null; C.hl = 0 }
        function pp(e) { const r = $('cnv').getBoundingClientRect(); return { x: Math.max(30, Math.min(290, (e.clientX - r.left) * 320 / r.width)), y: Math.max(26, Math.min(194, (e.clientY - r.top) * 220 / r.height)) } }
        function coach() {
            const a = an(), pr = mode == 'j', J = t().pj[C.proj]; let code = a.e || 'ok';
            if (pr) { const miss = J.p.filter(k => !C.parts.some(p => p.k == k)); if (miss.length) code = 'mp:' + miss.join(',') }
            if (C.last != code) { C.last = code; C.hl = 0 } C.hl++; let H;
            if (code == 'ok') H = t().ok; else if (code[0] == 'm') H = C.hl < 2 ? t().mp1 : t().mp2 + code.slice(3).split(',').map(k => t().pn[k]).join(', ');
            else H = t().ch[code][Math.min(C.hl, 2) - 1] + (C.hl > 2 ? ' ' + t().again2 : '');
            $('cm').innerHTML = `<div class='hint'>🤖 ${H}${code == 'ok' ? '' : ' (' + Math.min(C.hl, 2) + '/2)'}</div>`
        }
        function cbDraw() {
            const q = $('quiz'), pr = mode == 'j', J = t().pj[C.proj], kinds = pr ? J.p : Object.keys(KS); if (C.m != mode) { C.m = mode; rs0() }
            q.innerHTML = `<div class='q'>${pr ? t().tj : t().tl}</div>` + (pr ? `<select class='sec' id='pj'>${t().pj.map((x, k) => `<option value='${k}' ${k == C.proj ? 'selected' : ''}>${x.n}</option>`).join('')}</select><p style='margin:8px 0;font-size:14px'>🎯 ${J.g}<br>🧰 <b>${t().tools}:</b> ${J.p.map(k => KS[k] + ' ' + t().pn[k]).join(' · ')}</p>` : `<p style='color:var(--mu);margin:0 0 4px;font-size:13px'>${t().ldh}</p>`) +
                `<div class='tray' id='tr'>${kinds.map(k => `<button class='sec' data-k='${k}'>${KS[k]} ${t().pn[k]}</button>`).join('')}</div><svg id='cnv' class='cv' viewBox='0 0 320 220' width='100%'></svg><div class='row'><button class='pri' id='ca'>🤖 ${t().coach}</button><button class='sec' id='cc'>${t().clr}</button></div><div id='cm'></div><p style='color:var(--mu);font-size:12px'>${t().cnote}</p>`;
            const sv = $('cnv');
            $('tr').onpointerdown = e => { const b = e.target.closest('[data-k]'); if (!b) return; e.preventDefault(); const pt = pp(e), p = { id: C.id++, k: b.dataset.k, x: pt.x, y: pt.y, on: 1 }; C.parts.push(p); C.drag = p; C.mv = 1; cr() };
            sv.onpointerdown = e => {
                const d = e.target.dataset;
                if (d.t) { if (!C.sel) C.sel = d.t; else { if (C.sel.split('.')[0] != d.t.split('.')[0] && !C.wires.some(w => (w[0] == C.sel && w[1] == d.t) || (w[1] == C.sel && w[0] == d.t))) C.wires.push([C.sel, d.t]); C.sel = null } cr() }
                else if (d.w != null) { C.wires.splice(+d.w, 1); C.sel = null; cr() }
                else { const g = e.target.closest('[data-id]'); if (g) { C.drag = C.parts.find(p => p.id == g.dataset.id); C.mv = 0; C.sx = e.clientX; C.sy = e.clientY; e.preventDefault() } }
            };
            if (!window._dl) { window._dl = 1; document.addEventListener('pointermove', e => { if (!C.drag || !$('cnv')) return; if (Math.hypot(e.clientX - C.sx, e.clientY - C.sy) > 4) C.mv = 1; if (!C.mv) return; const pt = pp(e); C.drag.x = pt.x; C.drag.y = pt.y; cr() }); document.addEventListener('pointerup', () => { if (C.drag) { if (!C.mv && C.drag.k == 'sw') C.drag.on ^= 1; C.drag = null; cr() } }) }
            $('ca').onclick = coach; $('cc').onclick = () => { rs0(); $('cm').innerHTML = ''; cr() };
            if ($('pj')) $('pj').onchange = e => { C.proj = +e.target.value; rs0(); cbDraw() }; cr()
        }
        $('lg').onclick = () => { L = L == 'en' ? 'ar' : 'en'; txt() };
        $('go').onclick = () => $('demo').scrollIntoView({ behavior: 'smooth' });
        txt();
    </script>
</body>
